apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: smart-parking-alertmanager
  namespace: monitoring

spec:

  route:
    receiver: smart-parking-sre
    groupBy:
      - alertname
      - service
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

    routes:

      - matchers:
          - name: severity
            matchType: "="
            value: critical
        receiver: smart-parking-critical

      - matchers:
          - name: severity
            matchType: "="
            value: warning
        receiver: smart-parking-warning

  receivers:

    - name: smart-parking-sre

    - name: smart-parking-critical

    - name: smart-parking-warning