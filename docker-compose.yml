services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: "0:0"
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  db-init:
    build: ./backend
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    command: npm run db:init
    depends_on:
      - dynamodb
    restart: "no"

  backend:
    build: ./backend
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      USERS_TABLE: Users
      PARKING_LOTS_TABLE: ParkingLots
      SLOTS_TABLE: ParkingSlots
      RESERVATIONS_TABLE: Reservations
      JWT_SECRET: local-development-secret
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dynamodb-data:
